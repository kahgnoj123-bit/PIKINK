<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>계좌번호 복사</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f6f8;
      color: #20242b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 420px);
      padding: 32px 24px;
      border: 1px solid #e7e9ee;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(20, 30, 50, .07);
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0 0 22px; color: #687080; font-size: 14px; }
    .account {
      margin: 0 0 18px;
      padding: 17px 12px;
      border-radius: 12px;
      background: #f4f6fa;
      font-size: clamp(18px, 5vw, 22px);
      font-weight: 700;
      letter-spacing: .2px;
      word-break: keep-all;
    }
    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: #2457c5;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1948ad; }
    button:focus-visible { outline: 3px solid #9bb8ff; outline-offset: 3px; }
    #status { min-height: 22px; margin: 14px 0 0; color: #187344; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>계좌번호 복사</h1>
    <p>아래 버튼을 누르면 계좌번호가 복사됩니다.</p>
    <div class="account" id="account">국민은행 215401-04-204476</div>
    <button id="copyButton" type="button">계좌번호 복사하기</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    const textToCopy = "국민은행 215401-04-204476";
    const button = document.getElementById("copyButton");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(textToCopy);
        } else {
          const field = document.createElement("textarea");
          field.value = textToCopy;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const copied = document.execCommand("copy");
          field.remove();
          if (!copied) throw new Error("copy failed");
        }
        status.textContent = "복사되었습니다. 필요한 곳에 붙여넣으세요.";
        button.textContent = "복사 완료!";
        window.setTimeout(() => { button.textContent = "계좌번호 복사하기"; }, 1800);
      } catch (error) {
        status.textContent = "자동 복사가 되지 않았습니다. 텍스트를 길게 눌러 복사해 주세요.";
      }
    });
  </script>
</body>
</html>
